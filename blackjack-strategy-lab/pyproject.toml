[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-strategy-lab"
version = "0.1.0"
description = "Compare and optimize blackjack advantage-play strategies via Monte Carlo on identical shoes."
requires-python = ">=3.9"
dependencies = []        # standard library only

[tool.setuptools]
packages = ["bjlab"]
